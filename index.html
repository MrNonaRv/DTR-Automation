<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DTR Automate" />
    <title>DTR Automate</title>
    <link rel="apple-touch-icon" href="/Systemlogo.jpg" />
    <link rel="icon" type="image/jpeg" href="/Systemlogo.jpg" />
    
  
    <!-- Auto-reloader for Vite Dev Server -->
    <script>
      if (window.location.hostname !== 'localhost') {
        const originalConsoleError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('[vite]')) {
            // Suppress the console error
            // If it's a disconnect, wait 2 seconds and auto-refresh
            if (args[0].includes('server connection lost') || args[0].includes('connecting...')) {
              setTimeout(() => window.location.reload(), 2500);
            }
            return;
          }
          originalConsoleError.apply(console, args);
        };
      }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
