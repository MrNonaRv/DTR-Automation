<!doctype html>
<html lang="en">
  <head>
<script>
  window.addEventListener('error', function(e) {
    document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;">' + e.message + '<br/>' + e.filename + ':' + e.lineno + '</div>';
  });

  window.addEventListener('unhandledrejection', function(e) {
    document.body.innerHTML += '<div style="position:fixed;top:50px;left:0;z-index:9999;background:orange;color:black;padding:20px;">' + (e.reason ? e.reason.message || e.reason : 'unhandled rejection') + '</div>';
  });
</script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Service Worker unregistered');
          }
        });
      }
      // Also clear all caches to be safe
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names)
            caches.delete(name);
        });
      }
    </script>
