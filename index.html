<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DTR Automate" />
    <title>DTR Automate</title>
    <link rel="apple-touch-icon" href="/Systemlogo.jpg" />
    <link rel="icon" type="image/jpeg" href="/Systemlogo.jpg" />
    <script>
      // Emergency PWA Cache Clear
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      
      // If the app stays blank for 3 seconds, force clear cache and reload
      window.addEventListener('load', () => {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.innerHTML.trim() === '') {
            caches.keys().then((names) => {
              for (let name of names) caches.delete(name);
            });
            window.location.reload(true);
          }
        }, 3000);
      });
    </script>
  <script src="/clear-sw.js"></script></head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
